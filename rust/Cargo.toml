[package]
name = "otium"
version = "3.0.0-alpha.1"
edition = "2021"
description = "OTIUM — игровой лаунчер для Windows в стиле консоли"
authors = ["SoFTeR1"]
publish = false

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["wgpu", "default_fonts", "persistence"] }
egui = "0.31"
egui_extras ={ version = "0.31", features = ["all_loaders"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
gilrs = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
chrono = "0.4"
open = "5"
dirs = "5"
winreg = "0.55"
rfd = "0.15"
uuid = { version = "1", features = ["v4"] }
raw-window-handle = "0.6"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Power",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Com",
    "Win32_Storage_FileSystem",
    "Foundation",
    "Media_Control",
    "Storage_Streams",
] }
ureq = { version = "2", features = ["json"] }
regex = "1"
rodio = { version = "0.19", default-features = false }
tray-icon = "0.19"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
nostr-sdk = "0.45"
nostr = { version = "0.45", features = ["nip04"] }
futures = { version = "0.3", default-features = false, features = ["std"] }
webrtc = "0.21"
opus = "0.4"
nnnoiseless = "0.5"
rtc = "0.21.1"
async-trait = "0.1"
bytes = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev.package."*"]
opt-level = 2
