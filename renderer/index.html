<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' file: data: https:; media-src 'self' file: https: blob:; connect-src 'self' https: wss:; style-src 'self' 'unsafe-inline'" />
  <title>OTIUM</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="booting intro">
  <!-- startup splash (renderer/splash.js) -->
  <div id="splash">
    <canvas class="sp-lights"></canvas>
    <div class="sp-glow"></div>
    <div class="sp-center">
      <!-- OTIUM mark: a platinum ring that draws itself, a spark lighting up in its gap -->
      <svg class="sp-mark" viewBox="0 0 120 120" aria-hidden="true">
        <defs>
          <linearGradient id="spRing" x1="0.15" y1="0.1" x2="0.85" y2="0.95"><stop offset="0" stop-color="#ffffff"/><stop offset="0.45" stop-color="#d9e8ff"/><stop offset="1" stop-color="#6fa3ff"/></linearGradient>
          <radialGradient id="spSpark" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#ffffff"/><stop offset="0.35" stop-color="#cfe3ff" stop-opacity="0.9"/><stop offset="1" stop-color="#5b9bff" stop-opacity="0"/></radialGradient>
        </defs>
        <g transform="rotate(-16.2 60 60)"><circle class="sp-ring" cx="60" cy="60" r="46" pathLength="100"/></g>
        <g class="sp-spark"><circle cx="92.53" cy="27.47" r="16" fill="url(#spSpark)"/><circle cx="92.53" cy="27.47" r="4.2" fill="#fff"/></g>
      </svg>
      <div class="sp-word"><span>OTIUM</span></div>
    </div>
  </div>
  <div id="bg">
    <div class="bg-layer" id="bgA"></div>
    <div class="bg-layer" id="bgB"></div>
    <video class="bg-video" id="bgVideo" muted loop playsinline></video>
    <div class="bg-shade"></div>
  </div>

  <header class="topbar">
    <nav class="tabs">
      <button class="tab focusable" data-zone="tabs" data-tab="game">Игры</button>
      <button class="tab focusable" data-zone="tabs" data-tab="activity">Активность</button>
    </nav>
    <div class="status">
      <div class="playing hidden" id="playing"><i></i><span></span></div>
      <div class="sleepchip hidden" id="sleepChip" title="Таймер выключения">⏻ <span></span></div>
      <div class="np hidden" id="np"><div class="eq"><i></i><i></i><i></i><i></i></div><span></span></div>
      <button class="icon-btn focusable" data-zone="tabs" data-action="search" title="Поиск">
        <svg viewBox="0 0 24 24"><path d="M10 3a7 7 0 0 1 5.6 11.2l5.1 5.1-1.4 1.4-5.1-5.1A7 7 0 1 1 10 3zm0 2a5 5 0 1 0 0 10 5 5 0 0 0 0-10z"/></svg>
      </button>
      <button class="icon-btn focusable" data-zone="tabs" data-action="friends" title="Друзья и сообщения">
        <svg viewBox="0 0 24 24"><path d="M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zm0 2c-3.3 0-7 1.7-7 4v3h14v-3c0-2.3-3.7-4-7-4zm7.5-2a3.5 3.5 0 1 0-1.3-6.8A5.9 5.9 0 0 1 16 7a6 6 0 0 1-.8 3.8c.4.1.9.2 1.3.2zm1.5 2.2c1.3.9 2 2.1 2 3.8v3h3v-3c0-1.9-2.4-3.3-5-3.8z"/></svg>
        <b class="dot hidden" id="friendsDot"></b>
      </button>
      <button class="icon-btn focusable" data-zone="tabs" data-action="settings" title="Настройки">
        <svg viewBox="0 0 24 24"><path d="M19.4 13a7.6 7.6 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.4 7.4 0 0 0-1.7-1L15 3.3h-4l-.4 2.6a7.4 7.4 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.6 7.6 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1a7.4 7.4 0 0 0 1.7 1l.4 2.6h4l.4-2.6a7.4 7.4 0 0 0 1.7-1l2.5 1 2-3.5zM13 15.5A3.5 3.5 0 1 1 13 8.5a3.5 3.5 0 0 1 0 7z" transform="translate(-1 0)"/></svg>
      </button>
      <button class="avatar focusable" id="avatar" data-action="profile" title="Профиль">P</button>
      <div class="clock" id="clock">00:00</div>
    </div>
  </header>

  <main>
    <section class="row" id="row"><div class="track" id="track"></div></section>

    <section class="info" id="info">
      <img class="logo" id="logo" alt="" />
      <h1 class="title" id="title"></h1>
      <div class="meta" id="meta"></div>
      <div class="actions">
        <button class="btn-play focusable" data-zone="actions" id="btnPlay">Играть</button>
        <button class="btn-round focusable" data-zone="actions" id="btnMore" title="Параметры">•••</button>
      </div>
    </section>

    <div class="feed" id="feed"></div>
  </main>

  <footer class="hints" id="hints"></footer>

  <!-- Modal host -->
  <div class="overlay hidden" id="overlay">
    <div class="modal" id="modal"></div>
  </div>

  <div class="social hidden" id="social"></div>
  <div class="social profile hidden" id="profile"></div>
  <div class="cc hidden" id="cc"></div>
  <div class="osk hidden" id="osk"></div>
  <div class="mixer hidden" id="mixer"></div>
  <div class="call idle" id="call"></div>
  <div class="call idle" id="gring"></div>
  <div class="roompill hidden" id="roomPill"></div>
  <div class="toasts" id="toasts"></div>

  <script src="vendor/hls.min.js"></script>
  <script src="vendor/nostr.bundle.js"></script>
  <script src="app.js"></script>
  <script src="splash.js"></script>
  <script src="padtest.js"></script>
  <script src="feed.js"></script>
  <script src="overlays.js"></script>
  <script src="social.js"></script>
  <script src="profile.js"></script>
  <script src="voice.js"></script>
  <script src="groups.js"></script>
  <script src="presence.js"></script>
</body>
</html>
