<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' file: data: https:; media-src 'self' file: https: blob:; connect-src 'self' https:; style-src 'self' 'unsafe-inline'" />
  <title>PS5 Launcher</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="booting">
  <div id="bg">
    <div class="bg-layer" id="bgA"></div>
    <div class="bg-layer" id="bgB"></div>
    <video class="bg-video" id="bgVideo" muted loop playsinline></video>
    <div class="bg-shade"></div>
  </div>

  <header class="topbar">
    <nav class="tabs">
      <button class="tab focusable" data-zone="tabs" data-tab="game">Игры</button>
      <button class="tab focusable" data-zone="tabs" data-tab="app">Медиа</button>
    </nav>
    <div class="status">
      <div class="np hidden" id="np"><div class="eq"><i></i><i></i><i></i><i></i></div><span></span></div>
      <button class="icon-btn focusable" data-zone="tabs" data-action="search" title="Поиск">
        <svg viewBox="0 0 24 24"><path d="M10 3a7 7 0 0 1 5.6 11.2l5.1 5.1-1.4 1.4-5.1-5.1A7 7 0 1 1 10 3zm0 2a5 5 0 1 0 0 10 5 5 0 0 0 0-10z"/></svg>
      </button>
      <button class="icon-btn focusable" data-zone="tabs" data-action="settings" title="Настройки">
        <svg viewBox="0 0 24 24"><path d="M19.4 13a7.6 7.6 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.4 7.4 0 0 0-1.7-1L15 3.3h-4l-.4 2.6a7.4 7.4 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.6 7.6 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1a7.4 7.4 0 0 0 1.7 1l.4 2.6h4l.4-2.6a7.4 7.4 0 0 0 1.7-1l2.5 1 2-3.5zM13 15.5A3.5 3.5 0 1 1 13 8.5a3.5 3.5 0 0 1 0 7z" transform="translate(-1 0)"/></svg>
      </button>
      <div class="avatar" id="avatar">P</div>
      <div class="clock" id="clock">00:00</div>
    </div>
  </header>

  <main>
    <section class="row" id="row"><div class="track" id="track"></div></section>

    <section class="info" id="info">
      <img class="logo" id="logo" alt="" />
      <h1 class="title" id="title"></h1>
      <div class="meta" id="meta"></div>
      <div class="actions">
        <button class="btn-play focusable" data-zone="actions" id="btnPlay">Играть</button>
        <button class="btn-round focusable" data-zone="actions" id="btnMore" title="Параметры">•••</button>
      </div>
    </section>

    <div class="feed" id="feed"></div>
  </main>

  <footer class="hints" id="hints"></footer>

  <!-- Modal host -->
  <div class="overlay hidden" id="overlay">
    <div class="modal" id="modal"></div>
  </div>

  <div class="toast hidden" id="toast"></div>

  <script src="vendor/hls.min.js"></script>
  <script src="app.js"></script>
  <script src="feed.js"></script>
</body>
</html>
