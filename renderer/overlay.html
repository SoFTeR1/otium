<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' file: data: https:; style-src 'self' 'unsafe-inline'" />
  <title>PS5 Launcher overlay</title>
  <style>
    :root { --ease: cubic-bezier(0.22, 0.8, 0.26, 1); }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; color: #fff;
      font-family: 'Segoe UI Variable Display', 'Segoe UI', system-ui, sans-serif; user-select: none; }
    button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
    svg { fill: currentColor; }

    /* ---- call pill (top centre, like the Discord overlay) ---- */
    #pill { position: fixed; top: 18px; left: 50%; transform: translate(-50%, -140%); transition: transform 0.45s var(--ease); }
    #pill.show { transform: translate(-50%, 0); }
    .pill {
      display: flex; align-items: center; gap: 12px; padding: 8px 10px 8px 8px; border-radius: 999px;
      background: linear-gradient(135deg, rgba(28, 36, 60, 0.92), rgba(12, 16, 30, 0.92));
      border: 1px solid rgba(91, 227, 138, 0.35); box-shadow: 0 14px 40px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(18px);
    }
    .av { position: relative; width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 18px; flex: 0 0 auto; transition: box-shadow 0.12s; }
    .av.speaking { box-shadow: 0 0 0 3px #5be38a, 0 0 22px rgba(91, 227, 138, 0.8); }
    .av .st { position: absolute; right: -3px; bottom: -3px; width: 18px; height: 18px; border-radius: 50%; background: #ef4444; display: grid; place-items: center; box-shadow: 0 0 0 2px #0e1424; }
    .av .st svg { width: 11px; height: 11px; }
    .who .t { font-size: 14px; font-weight: 600; }
    .who .d { font-size: 12px; color: #7cf0a4; font-variant-numeric: tabular-nums; }
    .ib { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: rgba(255, 255, 255, 0.1); transition: background 0.15s, transform 0.15s; }
    .ib:hover { background: rgba(255, 255, 255, 0.2); transform: scale(1.06); }
    .ib svg { width: 19px; height: 19px; }
    .ib.off { background: rgba(239, 68, 68, 0.22); color: #ff8a98; }
    .ib.hang { background: #ef4444; }
    .ib.hang:hover { background: #f05252; }

    /* ---- voice widget (top left, translucent, like the Discord overlay) ---- */
    #voice { position: fixed; top: 16px; left: 16px; display: flex; flex-direction: column; gap: 6px; opacity: 0; transform: translateX(-12px); transition: opacity 0.3s, transform 0.35s var(--ease); }
    #voice.show { opacity: 0.92; transform: none; }
    .vwrap { display: flex; flex-direction: column; gap: 6px; padding: 8px; margin: -8px; border-radius: 12px; text-align: left; transition: background 0.2s, box-shadow 0.2s; }
    #voice:hover { opacity: 1; }
    .vwrap:hover { background: rgba(17, 19, 24, 0.72); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45), inset 0 0 0 1px rgba(255, 255, 255, 0.08); }
    .vopen { height: 0; overflow: hidden; opacity: 0; font-size: 12px; font-weight: 600; color: #8fc2ff; transition: height 0.2s, opacity 0.2s; }
    .vwrap:hover .vopen { height: 18px; opacity: 1; }
    .vrow { display: flex; align-items: center; gap: 8px; }
    .vav { position: relative; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 700; flex: 0 0 auto;
      box-shadow: 0 0 0 2px rgba(0, 0, 0, 0.35); transition: box-shadow 0.1s; }
    .vav.speaking { box-shadow: 0 0 0 2px #23a55a, 0 0 8px rgba(35, 165, 90, 0.7); }
    .vname { display: flex; align-items: center; gap: 6px; height: 24px; padding: 0 9px; border-radius: 6px; background: rgba(0, 0, 0, 0.55); font-size: 13px; font-weight: 600; color: #f2f3f5;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6); max-width: 220px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .vname.dim { color: #b5bac1; }
    .vname svg { width: 15px; height: 15px; fill: #f23f43; flex: 0 0 auto; }
    .vhead { display: flex; align-items: center; gap: 6px; height: 20px; padding: 0 8px; border-radius: 5px; background: rgba(0, 0, 0, 0.45); font-size: 11px; font-weight: 600; color: #23a55a; width: max-content; }
    .vhead i { width: 6px; height: 6px; border-radius: 50%; background: #23a55a; }
    .vhead b { color: #b5bac1; font-weight: 500; font-variant-numeric: tabular-nums; }

    /* ---- incoming call (top right, like a Windows call toast) ---- */
    #incoming { position: fixed; top: 22px; right: 22px; width: 380px; transform: translateX(120%); transition: transform 0.45s var(--ease); }
    #incoming.show { transform: none; }
    .card {
      border-radius: 16px; padding: 18px; background: linear-gradient(160deg, rgba(36, 46, 76, 0.96), rgba(14, 18, 32, 0.97));
      border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 0 24px 60px rgba(0, 0, 0, 0.6); backdrop-filter: blur(20px);
    }
    .card .top { display: flex; align-items: center; gap: 14px; }
    .card .av { width: 58px; height: 58px; font-size: 24px; }
    .card .av::after { content: ''; position: absolute; inset: -6px; border-radius: 50%; border: 2px solid rgba(91, 227, 138, 0.7); animation: ring 1.6s ease-out infinite; }
    @keyframes ring { from { transform: scale(0.9); opacity: 1; } to { transform: scale(1.45); opacity: 0; } }
    .card .k { font-size: 12px; color: #9fb0d8; letter-spacing: 0.08em; text-transform: uppercase; }
    .card .n { font-size: 20px; font-weight: 600; margin-top: 2px; }
    .card .row { display: flex; gap: 10px; margin-top: 16px; }
    .card .btn { flex: 1; height: 42px; border-radius: 12px; display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 600; font-size: 14px; transition: filter 0.15s; }
    .card .btn:hover { filter: brightness(1.12); }
    .card .btn svg { width: 18px; height: 18px; }
    .card .btn.yes { background: #22c55e; }
    .card .btn.no { background: #ef4444; }
    .card .hint { margin-top: 10px; font-size: 12px; color: #8191b8; text-align: center; }

    /* ---- notifications (bottom right, Windows 11 style) ---- */
    #toasts { position: fixed; right: 22px; bottom: 22px; display: flex; flex-direction: column; gap: 10px; align-items: flex-end; }
    .toast {
      width: 380px; border-radius: 12px; padding: 12px 14px 14px; background: rgba(32, 34, 42, 0.94);
      border: 1px solid rgba(255, 255, 255, 0.08); box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5); backdrop-filter: blur(24px) saturate(1.4);
      transform: translateX(120%); opacity: 0; transition: transform 0.42s var(--ease), opacity 0.3s;
    }
    .toast.show { transform: none; opacity: 1; }
    .toast .app { display: flex; align-items: center; gap: 8px; font-size: 12px; color: #b9c0d0; margin-bottom: 10px; }
    .toast .app img { width: 16px; height: 16px; border-radius: 4px; }
    .toast .body { display: flex; gap: 12px; align-items: flex-start; }
    .toast .pic { width: 48px; height: 48px; border-radius: 50%; flex: 0 0 auto; display: grid; place-items: center; font-weight: 700; font-size: 20px; background: #2a3042 center / cover no-repeat; }
    .toast .pic.sq { border-radius: 10px; }
    .toast .pic.emoji { font-size: 26px; background: rgba(255, 255, 255, 0.08); border-radius: 10px; }
    .toast .tt { font-size: 15px; font-weight: 600; }
    .toast .tx { font-size: 14px; color: #d5dbe8; margin-top: 2px; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .toast.err { border-left: 3px solid #ff4d63; }
  </style>
</head>
<body>
  <div id="voice"></div>
  <div id="incoming"></div>
  <div id="toasts"></div>
  <script src="overlay.js"></script>
</body>
</html>
